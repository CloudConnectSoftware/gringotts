# Gringotts config manifest — non-secret templates and gitignored local config files.
# Gringotts tracks *where* config lives and which example to copy; values stay local.

config_files:
  - id: portkey-irc-client
    repo: portkey
    path: portkey.irc.client.yaml
    template: portkey.irc.client.lupin.example.yaml
    gitignored: true
    scope: irc-client
    description: portkey irc peek/tail/send — host, TLS port, oper password reference

  - id: portkey-irc-connection-notes
    repo: portkey
    path: operations/irc-connection.cc-company-chat.txt
    template: null
    gitignored: true
    scope: irc-client
    description: Deploy-time FQDN and mIRC notes (generated by portkey deploy-irc)

  - id: matador-dockerignore
    repo: portkey
    path: .dockerignore
    template: null
    gitignored: false
    scope: matador-aci
    description: Workspace-root dockerignore — keeps .env out of ACR build context