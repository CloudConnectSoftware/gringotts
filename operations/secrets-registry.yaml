# Gringotts Key Vault registry — secret *names* and metadata only.
# Values never belong in git. Populate gringotts/vault/<scope>.env locally (gitignored).
#
# Human-readable mirror: hermione/docs/operations/matador/secrets.md
# Repo .env.example files win on conflict for per-wizard detail.

scopes:
  matador-aci:
    description: Matador container on Azure Container Instances (6-package profile today)
    doc: hermione/docs/operations/matador/secrets.md
    vault_file: matador-aci.env
    secrets:
      - name: ANTHROPIC_API_KEY
        wizard: nostradamus
        required: true
      - name: XAI_API_KEY
        wizard: nostradamus
        required: true
      - name: PROMPT_DEFAULT
        wizard: nostradamus
        required: true
        notes: One PROMPT_<KEY> per mapping; PROMPT_DEFAULT is the usual minimum
      - name: DefaultConnection
        wizard: ridcully
        required: true
      - name: KeyVaultUri
        wizard: ridcully
        required: true
      - name: LIBRARIAN_AZURE_STORAGE_CONNECTION_STRING
        wizard: librarian
        required: true
      - name: LIBRARIAN_OUTPUT_CONTAINER
        wizard: librarian
        required: true
      - name: MOODY_API_KEY
        wizard: moody
        required: true
      - name: MOODY_RESCUE_SPEC
        wizard: moody
        required: true
      - name: GEMINI_API_KEY
        wizard: automatica
        required: false
      - name: RIDCULLY_GIT_PAT
        wizard: ridcully
        required: matador2
      - name: RIDCULLY_RULES_REPO
        wizard: ridcully
        required: matador2
      - name: MOODY_LEGACY_SB_CONNECTION
        wizard: moody
        required: matador2
      - name: RIDCULLY_LOG_BLOB_CONNECTION
        wizard: ridcully
        required: matador3
        notes: Prologger log blob account; same value as legacy LogFileBlobConnectionString
      - name: DUMBLEDORE_API_KEY
        wizard: dumbledore
        required: matador3
      - name: MOODY_MATADOR3_SAURON_CMD
        wizard: moody
        required: false
        notes: Loop entry command; default generate-rules --start-test or rules-loop
      - name: MOODY_MATADOR2_SAURON_CMD
        wizard: moody
        required: false
        notes: Test-result callback; matador3 uses rules-continue

  irc-client:
    description: Company IRC — portkey irc peek/tail/send client config
    doc: hermione/docs/how-to/company-irc-setup.md
    vault_file: irc-client.yaml
    secrets:
      - name: oper_password
        wizard: portkey
        required: true
        notes: From portkey operations/irc-oper.*.txt — not committed; referenced by client yaml