[project]
name = "gringotts"
version = "0.1.0"
description = "Gringotts — repo vault wizard: canonical registry and sync for the modern platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
gringotts = "gringotts.cli.app:app"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100